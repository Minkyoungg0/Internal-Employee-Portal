spring:
  application:
    name: employee-portal-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:employee_app}
    password: ${DB_PASSWORD:local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.bitcomputer.employeeportal.backgroundcheck: INFO

background-check:
  base-url: ${BACKGROUND_CHECK_BASE_URL:https://54capvm12g.execute-api.ap-northeast-2.amazonaws.com}
  candidate-key: ${BACKGROUND_CHECK_CANDIDATE_KEY:not-configured}
  get-timeout: 35s
  retention-cleanup-delay: ${BACKGROUND_CHECK_RETENTION_CLEANUP_DELAY:1d}
  retry-budget: 180s
  retry-500-delay: 5s
  retry-503-default-delay: 30s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
